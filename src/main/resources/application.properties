# --- Servidor ---
server.port=8080

# --- Banco de dados H2 (em memória) ---
# Simples para desenvolvimento/apresentação: os dados somem ao reiniciar a aplicação.
spring.datasource.url=jdbc:h2:mem:tododb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console web do H2, útil para inspecionar as tabelas durante o desenvolvimento
# Acesse em http://localhost:8080/h2-console (JDBC URL: jdbc:h2:mem:tododb)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA / Hibernate ---
# update: cria/atualiza as tabelas automaticamente a partir das entidades (Todo)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- Thymeleaf ---
# Desliga o cache de templates para ver alterações no HTML sem reiniciar
spring.thymeleaf.cache=false
