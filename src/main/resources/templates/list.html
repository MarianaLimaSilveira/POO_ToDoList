<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Minhas Tarefas</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container">
    <header>
        <h1>📋 Minha Lista de Tarefas</h1>
        <a th:href="@{/tarefas/nova}" class="btn btn-primary">+ Nova Tarefa</a>
    </header>

    <!-- Caso não haja nenhuma tarefa cadastrada -->
    <p th:if="${#lists.isEmpty(tarefas)}" class="vazio">
        Nenhuma tarefa cadastrada ainda. Que tal adicionar a primeira?
    </p>

    <ul class="lista-tarefas" th:unless="${#lists.isEmpty(tarefas)}">
        <!-- th:each percorre a lista "tarefas" enviada pelo Controller -->
        <li th:each="tarefa : ${tarefas}"
            th:class="${tarefa.concluida} ? 'tarefa concluida' : 'tarefa'">

            <div class="tarefa-info">
                <h3 th:text="${tarefa.titulo}">Título da tarefa</h3>
                <p th:if="${tarefa.descricao != null and !tarefa.descricao.isEmpty()}"
                   th:text="${tarefa.descricao}">Descrição</p>
                <span class="data" th:text="${'Criada em: ' + #temporals.format(tarefa.dataCriacao, 'dd/MM/yyyy')}">
                    Criada em: 01/01/2026
                </span>
            </div>

            <div class="tarefa-acoes">
                <!-- Marcar como concluída / pendente -->
                <form th:action="@{/tarefas/{id}/concluir(id=${tarefa.id})}" method="post">
                    <button type="submit" class="btn btn-check"
                            th:text="${tarefa.concluida} ? '↺ Reabrir' : '✓ Concluir'">
                        Concluir
                    </button>
                </form>

                <!-- Editar -->
                <a th:href="@{/tarefas/{id}/editar(id=${tarefa.id})}" class="btn btn-edit">✎ Editar</a>

                <!-- Excluir -->
                <form th:action="@{/tarefas/{id}/excluir(id=${tarefa.id})}" method="post"
                      onsubmit="return confirm('Tem certeza que deseja excluir esta tarefa?');">
                    <button type="submit" class="btn btn-delete">🗑 Excluir</button>
                </form>
            </div>
        </li>
    </ul>
</div>

</body>
</html>
