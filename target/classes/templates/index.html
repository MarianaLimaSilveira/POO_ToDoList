<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Lista de Tarefas</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="/style.css">
    </head>
    <body>
        <main class="container">
            <h1 th:text="${editando} != null ? 'Editar Tarefa' : 'Inserir Tarefa'">Inserir Tarefa</h1>

            
            <section class="box-interna form-box">
                <form method="post" action="/salvar" style="display:flex; flex-wrap:wrap; gap:12px; align-items:flex-end;">
                    <input type="hidden" name="id" th:value="${editando} != null ? ${editando.id} : ''"/>

                    <div class="campo">
                        <label>Tarefa</label>
                        <input type="text" name="title" th:value="${editando} != null ? ${editando.title} : ''" required/>
                    </div>

                    <div class="campo">
                        <label>Prazo</label>
                        <input type="datetime-local" name="deadLine"
                               th:value="${editando} != null ? ${editando.deadLine} : ''" required/>
                    </div>

                    <button type="submit" class="btn-salvar" th:text="${editando} != null ? 'Atualizar' : 'Salvar'">Salvar</button>
                    <a th:if="${editando} != null" href="/" class="btn-cancelar">Cancelar</a>
                </form>
            </section>

            <section class="box-interna tabela-box">
                <table>
                    <thead>
                        <tr>
                            <th>Título</th>
                            <th>Criada em</th>
                            <th>Prazo</th>
                            <th>Situação</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="todo : ${todos}">
                            <td data-label="Título" th:text="${todo.title}"></td>
                            <td data-label="Criada em" th:text="${#temporals.format(todo.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
                            <td data-label="Prazo" th:text="${#temporals.format(todo.deadLine, 'dd/MM/yyyy HH:mm')}"></td>
                            <td data-label="Situação">
                                <span th:class="${todo.finished} ? 'situacao-concluida' : 'situacao-pendente'"
                                      th:text="${todo.finished} ? 'Concluída' : 'Pendente'"></span>
                            </td>
                            <td data-label="Ações" class="acoes">
                                <form method="post" th:action="@{/{id}/concluir(id=${todo.id})}" style="display:inline">
                                    <button type="submit" th:class="${todo.finished} ? 'btn-reabrir' : 'btn-concluir'"
                                            th:text="${todo.finished} ? 'Reabrir' : 'Concluir'"></button>
                                </form>
                                <a th:href="@{/{id}/editar(id=${todo.id})}" class="btn-editar">Editar</a>
                                <form method="post" th:action="@{/{id}/excluir(id=${todo.id})}" style="display:inline"
                                      onsubmit="return confirm('Tem certeza que deseja excluir esta tarefa?');">
                                    <button type="submit" class="btn-excluir">Excluir</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </section>
        </main>
    </body>
</html>
