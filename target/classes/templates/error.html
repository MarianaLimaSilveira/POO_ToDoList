<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Ops! - Lista de Tarefas</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="/style.css">
    </head>
    <body>
        <main class="container">
            <h1 th:text="${status} != null and ${status} == 404 ? 'Ops! Não encontramos isso :(' : 'Ops! Algo deu errado'">
                Ops!
            </h1>

            <section class="box-interna form-box" style="text-align:center;">
                <p style="font-size:1.1em; margin:0 0 8px 0;"
                   th:text="${message} != null and ${message} != '' and ${message} != 'No message available'
                             ? ${message}
                             : (${status} != null and ${status} == 404
                                 ? 'A página que você tentou acessar não existe.'
                                 : 'Não foi possível completar a operação solicitada.')">
                    Ocorreu um erro.
                </p>

                <p style="opacity:0.7; font-size:0.9em; margin:0 0 20px 0;" th:if="${status} != null">
                    Código do erro: <span th:text="${status}"></span>
                </p>

                <a href="/" class="btn-salvar" style="display:inline-block; text-decoration:none;">
                    Voltar para o início
                </a>
            </section>
        </main>
    </body>
</html>
