spring.application.name=todolistif
spring.datasource.username=aluno
spring.datasource.password=aluno
spring.datasource.url=jdbc:mysql://localhost:3306/todolist

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8081

# Faz o BasicErrorController expor a mensagem de erro para a view "error"
# (templates/error.html), usada tanto nos erros tratados quanto no 404
# automático de rotas inexistentes.
server.error.include-message=always
